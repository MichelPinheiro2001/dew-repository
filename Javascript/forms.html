<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula - Testes JavaScript</title>
    <meta name="description" content="Página para testar scripts JavaScript" />

    <script src="./forms.js" defer></script>
</head>

<body>
    <header>
        <h1>Laboratório de Scripts</h1>
    </header>
    <main>
        <form action="" id="formularioAcademico">
            <h2>Formulário</h2>

            <div>
                <label for="nome">Digite seu nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome" 
                    laceholder="Digite seu nome" required />
            </div>

            <div>
                <label for="nota1">Nota 1</label>
                <input 
                    type="number" 
                    id="nota1" 
                    name="nota1" 
                    placeholder="Digite a nota 1" 
                    min="0" 
                    max="10" 
                    step="0.1" 
                    required 
                />
            </div>

            <div>
                <label for="nota2">Nota 2</label>
                <input 
                    type="number" 
                    id="nota2" 
                    name="nota2" 
                    placeholder="Digite a nota 2" 
                    min="0" 
                    max="10" 
                    step="0.1" 
                    required 
                />
            </div>

            <!-- Botões de Ação -->
            <div style="margin-top: 15px;">
                <button type="button" id="btnCalcular">Calcular Média</button>
                <button type="reset" id="btnLimpar">Limpar Campos</button>
            </div>

            <!-- Área para exibir o resultado -->
            <div id="resultado" style="margin-top: 15px; font-weight: bold;"></div>
        </form>
    </main>
</body>

</html>
